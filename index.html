<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFC – Minecraft Fighting Club</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --text: #ffffff;
    --accent: #ff3c3c;
    --green: #00ff88;
    --red: #ff4444;
    --border: #333;
  }
  body.light {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #111;
    --border: #ddd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    transition: background 0.3s, color 0.3s;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    gap: 20px;
  }
  h1 {
    font-size: 2.4rem;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .subtitle { opacity: 0.7; font-size: 0.95rem; margin-top: 4px; }
  #settingsBtn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    white-space: nowrap;
    flex-shrink: 0;
    width: auto;
  }
  #settingsBtn:hover {
    background: var(--accent);
    color: white;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .rank-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-badge {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .rank-badge.C { background: gold; color: #111; }
  .name { font-size: 1.3rem; font-weight: 600; flex: 1; }
  .record { font-size: 1.1rem; opacity: 0.85; }
  .arrow { font-size: 1.4rem; margin-left: 10px; }
  .arrow.up { color: var(--green); }
  .arrow.down { color: var(--red); }

  .fight {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    text-align: center;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .fight:last-of-type { border-bottom: none; }
  .fighter { font-size: 1.25rem; font-weight: 600; }
  .vs { font-size: 1.1rem; opacity: 0.6; }
  .tbd { font-size: 0.95rem; opacity: 0.7; margin-top: 4px; }

  .challenger {
    text-align: center;
    padding: 16px;
    font-size: 1.2rem;
    opacity: 0.8;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 90%;
    max-width: 420px;
  }
  .modal h2 { margin-bottom: 18px; }
  label { display: block; margin: 12px 0 6px; font-size: 0.95rem; }
  input, select, button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  button { cursor: pointer; margin-top: 12px; background: var(--accent); color: white; border: none; font-weight: 600; }
  .theme-btn { background: #444; margin-bottom: 10px; }
  .admin-section { display: none; margin-top: 20px; }
  .admin-section.show { display: block; }
  .close-btn { background: #555; margin-top: 16px; }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>MFC</h1>
      <div class="subtitle">Minecraft Fighting Club</div>
    </div>
    <button id="settingsBtn" type="button">⚙ Settings</button>
  </div>

  <div class="card">
    <h2 style="margin-bottom:16px;">Rankings</h2>
    <div id="rankings"></div>
  </div>

  <div class="card">
    <h2 style="margin-bottom:16px;">Fight Schedule</h2>
    <div id="schedule"></div>
  </div>

  <div class="card">
    <div class="challenger">
      <strong>Challenger Series</strong><br>
      Coming soon
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>Settings</h2>
      <button class="theme-btn" id="themeToggle">Toggle Brightness (Light / Dark)</button>
      <div style="margin-top:20px;">
        <label>Admin Password</label>
        <input type="password" id="adminPass" placeholder="Enter password">
        <button id="loginBtn">Login as Admin</button>
      </div>
      <div class="admin-section" id="adminSection">
        <h3 style="margin:16px 0 10px;">Declare Winner</h3>
        <label>Fight</label>
        <select id="fightSelect"></select>
        <label>Winner</label>
        <select id="winnerSelect"></select>
        <button id="declareBtn">Confirm Result</button>
      </div>
      <button class="close-btn" id="closeModal">Close</button>
    </div>
  </div>

<script>
  let fighters = [
    { name: "Milo",   rank: "C", wins: 0, losses: 0 },
    { name: "Imran",  rank: "1", wins: 0, losses: 0 },
    { name: "Matthew",rank: "2", wins: 0, losses: 0 },
    { name: "Yusuf",  rank: "3", wins: 0, losses: 0 }
  ];

  let fights = [
    { id: 1, left: "Milo",   right: "Imran",   status: "TBD" },
    { id: 2, left: "Matthew",right: "Yusuf",   status: "TBD" }
  ];

  let isAdmin = false;
  let lastArrows = {};

  function renderRankings() {
    const container = document.getElementById("rankings");
    const order = { "C": 0, "1": 1, "2": 2, "3": 3 };
    const sorted = [...fighters].sort((a,b) => order[a.rank] - order[b.rank]);

    container.innerHTML = sorted.map(f => {
      const arrow = lastArrows[f.name] || "";
      return `
        <div class="rank-row">
          <div class="rank-badge ${f.rank}">${f.rank}</div>
          <div class="name">${f.name}</div>
          <div class="record">${f.wins}-${f.losses}</div>
          ${arrow ? `<span class="arrow ${arrow}">${arrow === "up" ? "↑" : "↓"}</span>` : ""}
        </div>`;
    }).join("");
  }

  function renderSchedule() {
    const container = document.getElementById("schedule");
    container.innerHTML = fights.map(f => `
      <div class="fight">
        <div class="fighter">${f.left}</div>
        <div>
          <div class="vs">versus</div>
          <div class="tbd">${f.status}</div>
        </div>
        <div class="fighter">${f.right}</div>
      </div>`).join("");
  }

  function updateAdminSelects() {
    const fightSelect = document.getElementById("fightSelect");
    fightSelect.innerHTML = fights
      .filter(f => f.status === "TBD")
      .map(f => `<option value="${f.id}">${f.left} vs ${f.right}</option>`)
      .join("") || `<option value="">No pending fights</option>`;
    populateWinnerSelect();
  }

  function populateWinnerSelect() {
    const fightId = document.getElementById("fightSelect").value;
    const fight = fights.find(f => f.id == fightId);
    const winnerSelect = document.getElementById("winnerSelect");
    if (!fight) {
      winnerSelect.innerHTML = "";
      return;
    }
    winnerSelect.innerHTML = `
      <option value="${fight.left}">${fight.left}</option>
      <option value="${fight.right}">${fight.right}</option>`;
  }

  function declareWinner() {
    const fightId = +document.getElementById("fightSelect").value;
    const winnerName = document.getElementById("winnerSelect").value;
    const fight = fights.find(f => f.id === fightId);
    if (!fight || fight.status !== "TBD") return;

    const loserName = fight.left === winnerName ? fight.right : fight.left;
    const winner = fighters.find(f => f.name === winnerName);
    const loser  = fighters.find(f => f.name === loserName);
    winner.wins++;
    loser.losses++;

    lastArrows = {};
    lastArrows[winnerName] = "up";
    lastArrows[loserName]  = "down";

    const rankOrder = { "C": 0, "1": 1, "2": 2, "3": 3 };
    if (rankOrder[loser.rank] < rankOrder[winner.rank]) {
      const temp = winner.rank;
      winner.rank = loser.rank;
      loser.rank = temp;
    }

    fight.status = `${winnerName} wins`;

    setTimeout(() => {
      lastArrows = {};
      renderRankings();
    }, 8000);

    renderRankings();
    renderSchedule();
    updateAdminSelects();
    alert(`${winnerName} beats ${loserName}! Rankings updated.`);
  }

  document.getElementById("settingsBtn").onclick = () => {
    document.getElementById("settingsModal").classList.add("open");
    updateAdminSelects();
  };
  document.getElementById("closeModal").onclick = () => {
    document.getElementById("settingsModal").classList.remove("open");
  };
  document.getElementById("themeToggle").onclick = () => {
    document.body.classList.toggle("light");
  };
  document.getElementById("loginBtn").onclick = () => {
    const pass = document.getElementById("adminPass").value;
    if (pass === "mfc2026") {
      isAdmin = true;
      document.getElementById("adminSection").classList.add("show");
      alert("Admin access granted");
    } else {
      alert("Wrong password");
    }
  };
  document.getElementById("fightSelect").onchange = populateWinnerSelect;
  document.getElementById("declareBtn").onclick = declareWinner;

  renderRankings();
  renderSchedule();
</script>
</body>
</html>
