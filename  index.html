<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Fighting League - MFC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #f5f5f5;
      --bg-card: white;
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --text-muted: #999;
      --border-color: #e0e0e0;
      --accent: #1976d2;
      --success: #4caf50;
      --danger: #f44336;
      --warning: #ff9800;
    }
    
    body.dark-mode {
      --bg-primary: #1a1a1a;
      --bg-card: #2a2a2a;
      --text-primary: #f5f5f5;
      --text-secondary: #bbb;
      --text-muted: #777;
      --border-color: #444;
    }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s, color 0.3s;
    }
    
    .container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    
    .header { text-align: center; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
    .header-title { flex: 1; }
    .header h1 { font-size: 28px; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
    .header p { font-size: 14px; color: var(--text-secondary); }
    
    .header-controls { display: flex; gap: 12px; }
    
    .toggle-switch { 
      width: 50px; 
      height: 28px; 
      background: var(--border-color); 
      border-radius: 14px; 
      cursor: pointer; 
      position: relative;
      transition: background 0.3s;
    }
    .toggle-switch.active { background: var(--accent); }
    .toggle-switch-circle { 
      width: 24px; 
      height: 24px; 
      background: white; 
      border-radius: 50%; 
      position: absolute; 
      top: 2px; 
      left: 2px;
      transition: left 0.3s;
    }
    .toggle-switch.active .toggle-switch-circle { left: 24px; }
    
    .settings-btn {
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .settings-btn:hover { opacity: 0.9; }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    
    .modal-content {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .modal-header { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 1.5rem; }
    .modal-close { float: right; cursor: pointer; font-size: 24px; color: var(--text-muted); }
    .modal-close:hover { color: var(--text-primary); }
    
    .section { margin-bottom: 2rem; }
    .section-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .rankings { display: flex; flex-direction: column; gap: 8px; }
    .rank-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      padding: 1rem 1.25rem; 
      display: flex; 
      align-items: center; 
      gap: 16px;
      transition: all 0.2s ease;
    }
    .rank-card:hover { background: var(--bg-primary); border-color: var(--accent); }
    
    .rank-badge { 
      font-size: 20px; 
      font-weight: 700; 
      color: var(--accent); 
      min-width: 40px; 
      text-align: center;
    }
    .rank-badge.champion { font-size: 24px; color: var(--warning); }
    
    .rank-info { flex: 1; }
    .fighter-name { font-size: 16px; font-weight: 500; color: var(--text-primary); }
    .fighter-record { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    
    .rank-change { 
      font-size: 18px; 
      min-width: 24px; 
      text-align: center;
      font-weight: 600;
    }
    .change-up { color: var(--success); }
    .change-down { color: var(--danger); }
    .change-none { color: var(--text-muted); }
    
    .upcoming { display: flex; flex-direction: column; gap: 12px; }
    .fight-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      padding: 1.5rem 1.25rem;
    }
    .fight-matchup { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .fight-fighter { font-size: 15px; font-weight: 500; color: var(--text-primary); flex: 1; }
    .fight-fighter.left { text-align: left; }
    .fight-fighter.right { text-align: right; }
    .vs-center { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .vs { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .fight-date { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    
    .input-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.25rem; }
    .input-group { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    input { 
      flex: 1;
      min-width: 200px;
      padding: 10px 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 6px; 
      font-size: 14px; 
      color: var(--text-primary);
      background: var(--bg-primary);
    }
    input:focus { outline: none; border-color: var(--accent); }
    button { 
      padding: 10px 20px; 
      background: var(--accent); 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    
    .message { 
      margin-top: 1rem; 
      padding: 10px 12px; 
      border-radius: 6px; 
      font-size: 13px;
      display: none;
    }
    .message.success { 
      background: rgba(76, 175, 80, 0.2); 
      color: var(--success); 
      display: block;
    }
    .message.error { 
      background: rgba(244, 67, 54, 0.2); 
      color: var(--danger); 
      display: block;
    }
    
    .note { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 0.5rem; }
    
    .admin-notice {
      background: rgba(25, 118, 210, 0.1);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: 13px;
      color: var(--accent);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-title">
      <h1>Minecraft Fighting League</h1>
      <p>MFC — SMP Combat Rankings</p>
    </div>
    <div class="header-controls">
      <div class="toggle-switch" id="brightnessToggle" onclick="toggleBrightness()">
        <div class="toggle-switch-circle"></div>
      </div>
      <button class="settings-btn" onclick="openSettings()">Settings</button>
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">Current Rankings</div>
    <div class="rankings" id="rankings"><div style="text-align:center; padding: 1rem; color: var(--text-muted);">Loading live rankings...</div></div>
  </div>
  
  <div class="section">
    <div class="section-title">Upcoming Fights</div>
    <div class="upcoming" id="upcoming"></div>
  </div>
  
  <div class="section">
    <div class="section-title">Challenger Series</div>
    <div class="input-section">
      <p class="note">Only admins can update rankings. Visit Settings to log in.</p>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 1rem; line-height: 1.6;">
        <strong>Example matchups:</strong><br>
        Milo vs Imran<br>
        Matthew vs Yuesf
      </p>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      Settings
      <span class="modal-close" onclick="closeSettings()">×</span>
    </div>
    
    <div style="margin-bottom: 1.5rem;">
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 0.5rem;">Brightness</p>
      <div class="toggle-switch" id="settingsBrightnessToggle" onclick="toggleBrightness()">
        <div class="toggle-switch-circle"></div>
      </div>
    </div>
    
    <div style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
      <p style="font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 1rem;">Admin Access</p>
      <input type="password" id="adminPassword" placeholder="Enter admin password" style="width: 100%; margin-bottom: 0.75rem;" />
      <button onclick="loginAdmin()" style="width: 100%;">Login</button>
      <div id="adminMessage" class="message" style="margin-top: 0.75rem;"></div>
    </div>
  </div>
</div>

<!-- Firebase SDK Scripts -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCdqX91v0sgI8_vuRLoZGsr7R3QsMJL7Is",
    authDomain: "mfc2026.firebaseapp.com",
    projectId: "mfc2026",
    storageBucket: "mfc2026.appspot.com",
    messagingSenderId: "260137623247",
    appId: "1:260137623247:web:aafd538212e4a77436a1ba",
    measurementId: "G-9P1DB5LQK8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let fighters = [];
  
  const upcomingFights = [
    { fighter1: 'Milo', fighter2: 'Imran', date: 'TBD' },
    { fighter1: 'Matthew', fighter2: 'Yuesf', date: 'TBD' },
  ];
  
  const ADMIN_PASSWORD = 'mfc2026';
  let isAdminLoggedIn = false;

  async function loadFighters() {
    try {
      const querySnapshot = await getDocs(collection(db, "fighters"));
      fighters = [];
      querySnapshot.forEach((docSnap) => {
        fighters.push({ id: docSnap.id, ...docSnap.data() });
      });

      // If database is empty on first run, initialize default fighters
      if (fighters.length === 0) {
        const defaultFighters = [
          { name: 'Milo', rank: 'C', wins: 0, losses: 0, prevRank: 'C' },
          { name: 'Imran', rank: '1', wins: 0, losses: 0, prevRank: '1' },
          { name: 'Matthew', rank: '2', wins: 0, losses: 0, prevRank: '2' },
          { name: 'Yuesf', rank: '3', wins: 0, losses: 0, prevRank: '3' }
        ];
        for (let f of defaultFighters) {
          await setDoc(doc(db, "fighters", f.name.toLowerCase()), f);
          fighters.push(f);
        }
      }
      renderRankings();
    } catch (e) {
      console.error("Error loading fighters: ", e);
      document.getElementById('rankings').innerHTML = `<div style="text-align:center; padding: 1rem; color: var(--danger);">Error loading cloud rankings. Check connection.</div>`;
    }
  }

  window.toggleBrightness = function() {
    document.body.classList.toggle('dark-mode');
    document.getElementById('brightnessToggle').classList.toggle('active');
    document.getElementById('settingsBrightnessToggle').classList.toggle('active');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
  }
  
  window.openSettings = function() {
    document.getElementById('settingsModal').classList.add('active');
  }
  
  window.closeSettings = function() {
    document.getElementById('settingsModal').classList.remove('active');
  }
  
  window.loginAdmin = function() {
    const password = document.getElementById('adminPassword').value;
    const msg = document.getElementById('adminMessage');
    
    if (password === ADMIN_PASSWORD) {
      isAdminLoggedIn = true;
      msg.textContent = '✓ Admin access granted!';
      msg.className = 'message success';
      document.getElementById('adminPassword').value = '';
      setTimeout(() => {
        closeSettings();
        showAdminPanel();
      }, 1000);
    } else {
      msg.textContent = 'Incorrect password';
      msg.className = 'message error';
    }
  }
  
  function showAdminPanel() {
    const inputSection = document.querySelector('.input-section');
    inputSection.innerHTML = `
      <div class="admin-notice">✓ You're logged in as admin</div>
      <p class="note" style="margin-bottom: 1rem;">Enter a fight result to update rankings</p>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.6;">
        <strong>Format:</strong> Winner beat Loser<br>
        <strong>Examples:</strong><br>
        Matthew beat Yuesf<br>
        Imran beat Milo
      </p>
      <div class="input-group">
        <input type="text" id="fightInput" placeholder="Winner beat Loser" />
        <button onclick="submitFight()">Update</button>
      </div>
      <div class="message" id="message"></div>
    `;
    document.getElementById('fightInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') submitFight();
    });
  }
  
  function renderRankings() {
    const container = document.getElementById('rankings');
    const rankOrder = { 'C': 0, '1': 1, '2': 2, '3': 3 };
    
    fighters.sort((a, b) => rankOrder[a.rank] - rankOrder[b.rank]);

    container.innerHTML = fighters.map(f => {
      let changeIcon = '−';
      let changeClass = 'change-none';
      if (f.rank !== f.prevRank) {
        if (rankOrder[f.rank] < rankOrder[f.prevRank]) {
          changeIcon = '↑';
          changeClass = 'change-up';
        } else {
          changeIcon = '↓';
          changeClass = 'change-down';
        }
      }
      return `
        <div class="rank-card">
          <div class="rank-badge ${f.rank === 'C' ? 'champion' : ''}"><strong>${f.rank}</strong></div>
          <div class="rank-info">
            <div class="fighter-name">${f.name}</div>
            <div class="fighter-record">${f.wins}W - ${f.losses}L</div>
          </div>
          <div class="rank-change ${changeClass}">${changeIcon}</div>
        </div>
      `;
    }).join('');
  }
  
  function renderUpcoming() {
    const container = document.getElementById('upcoming');
    container.innerHTML = upcomingFights.map(f => `
      <div class="fight-card">
        <div class="fight-matchup">
          <span class="fight-fighter left">${f.fighter1}</span>
          <div class="vs-center">
            <span class="vs">vs</span>
            <span class="fight-date">${f.date}</span>
          </div>
          <span class="fight-fighter right">${f.fighter2}</span>
        </div>
      </div>
    `).join('');
  }
  
  function showMessage(text, type) {
    const msg = document.getElementById('message');
    if (msg) {
      msg.textContent = text;
      msg.className = 'message ' + type;
      setTimeout(() => {
        msg.className = 'message';
      }, 3000);
    }
  }
  
  window.submitFight = async function() {
    if (!isAdminLoggedIn) return;
    
    const input = document.getElementById('fightInput').value.trim();
    if (!input) {
      showMessage('Please enter a fight result', 'error');
      return;
    }
    
    const parts = input.toLowerCase().split(' beat ');
    if (parts.length !== 2) {
      showMessage('Format: "Winner beat Loser" (e.g., "Matthew beat Imran")', 'error');
      return;
    }
    
    const winner = parts[0].trim();
    const loser = parts[1].trim();
    
    const winnerIdx = fighters.findIndex(f => f.name.toLowerCase() === winner);
    const loserIdx = fighters.findIndex(f => f.name.toLowerCase() === loser);
    
    if (winnerIdx === -1 || loserIdx === -1) {
      showMessage('Fighter not found. Check the spelling!', 'error');
      return;
    }
    
    fighters.forEach(f => f.prevRank = f.rank);
    fighters[winnerIdx].wins++;
    fighters[loserIdx].losses++;
    
    const rankOrder = { 'C': 0, '1': 1, '2': 2, '3': 3 };
    if (rankOrder[fighters[winnerIdx].rank] > rankOrder[fighters[loserIdx].rank]) {
      const tempRank = fighters[winnerIdx].rank;
      fighters[winnerIdx].rank = fighters[loserIdx].rank;
      fighters[loserIdx].rank = tempRank;
    }
    
    try {
      // Save updated data to Firestore cloud database
      await setDoc(doc(db, "fighters", fighters[winnerIdx].name.toLowerCase()), fighters[winnerIdx]);
      await setDoc(doc(db, "fighters", fighters[loserIdx].name.toLowerCase()), fighters[loserIdx]);
      
      renderRankings();
      document.getElementById('fightInput').value = '';
      showMessage(`✓ ${fighters[winnerIdx].name} beat ${fighters[loserIdx].name}! Cloud updated.`, 'success');
    } catch (e) {
      console.error("Error updating database: ", e);
      showMessage('Error saving to database!', 'error');
    }
  }
  
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark-mode');
    document.getElementById('brightnessToggle').classList.add('active');
    document.getElementById('settingsBrightnessToggle').classList.add('active');
  }
  
  renderUpcoming();
  loadFighters();
</script>
</body>
</html>
